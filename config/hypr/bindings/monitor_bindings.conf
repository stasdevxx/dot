
# ─────────────────────────
# Monitor profiles (submap)
# ─────────────────────────

submap = monitors

# Select a monitor profile
bindd = , L, Monitors: Laptop,   exec, bash -lc 'config_dir="$HOME/.config/hypr"; profile_file="$config_dir/monitors/monitors_laptop.conf"; target_file="$config_dir/monitors.conf"; [[ -f "$profile_file" ]] || { notify-send -a Hyprland -t 1500 "Monitors" "Profile not found"; exit 1; }; cp --reflink=auto -- "$profile_file" "$target_file"; hyprctl reload; notify-send -a Hyprland -t 1500 "Monitors" "Laptop"'
bindd = , E, Monitors: External, exec, bash -lc 'config_dir="$HOME/.config/hypr"; profile_file="$config_dir/monitors/monitors_external.conf"; target_file="$config_dir/monitors.conf"; [[ -f "$profile_file" ]] || { notify-send -a Hyprland -t 1500 "Monitors" "Profile not found"; exit 1; }; cp --reflink=auto -- "$profile_file" "$target_file"; hyprctl reload; notify-send -a Hyprland -t 1500 "Monitors" "External"'

# Exit submap
bind = , catchall, submap, reset
submap = reset
