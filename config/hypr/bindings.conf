
# ─────────────────────────
# Application bindings
# ─────────────────────────

# Quick launchers and main apps
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser


# ─────────────────────────
# Launcher & help
# ─────────────────────────
unbind = SUPER ALT, SPACE

unbind = SUPER, S
bindd = SUPER, S, Launcher, exec, walker -p "Start…"
bindd = SUPER SHIFT, S, Omarchy menu, exec, omarchy-menu
bindd = SUPER ALT, S, Keybindings, exec, omarchy-menu-keybindings

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"


# ─────────────────────────
# Quickmenu
# ─────────────────────────

# Submap entry
bind = SUPER, Q, exec, bash -lc 'hyprctl dispatch submap quickmenu && notify-send -a Hyprland -t 1500 "Submap: Quick menu" "Entered — press Esc to exit"'

submap = quickmenu

# Web apps
bindd = , A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = ALT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com/?temporary-chat=true"
bindd = SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = , C, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com"
bindd = , T, Todoist, exec, omarchy-launch-webapp "https://app.todoist.com/app/today"
bindd = , G, ToggleTrack, exec, omarchy-launch-webapp "https://track.toggl.com/timer"
bindd = , E, Email, exec, omarchy-launch-webapp "https://mail.google.com"
bindd = , Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"

# Desktop apps
bindd = , N, Editor, exec, omarchy-launch-editor
bindd = , B, Browser, exec, $browser
bindd = , F, Files, exec, uwsm app -- nautilus --new-window
bindd = ALT, B, Browser (private), exec, $browser --private
bindd = SHIFT, B, Firefox, exec, firefox --new-window 
bindd = , S, Music, exec, omarchy-launch-or-focus spotify
bindd = , D, Docker, exec, $terminal -e lazydocker
bindd = , O, Obsidian, exec, omarchy-launch-or-focus obsidian

# Additional submaps
bind = , M, exec, bash -lc 'hyprctl dispatch submap monitors && notify-send -a Hyprland -t 5000 "Submap: Monitors" "Entered — press Esc to exit; Laptop = L, External = E"'
# bind = , W, exec, bash -lc 'hyprctl dispatch submap work && notify-send -a Hyprland -t 1500 "Submap: Work" "Entered — press Esc to exit"'

# Submap exit
bind = , catchall, submap, reset

submap = reset


# ─────────────────────────
# Workspace navigation
# ─────────────────────────
unbind = SUPER, I
unbind = SUPER, O
unbind = SUPER SHIFT, O
unbind = SUPER SHIFT, K

bindd = SUPER, O, Workspace: Next, workspace, +1
bindd = SUPER, I, Workspace: Previous, workspace, -1
bindd = SUPER SHIFT, O, Workspace: Move to next, movetoworkspace, +1
bindd = SUPER SHIFT, I, Workspace: Move to previous, movetoworkspace, -1


# ─────────────────────────
# Window switching
# ─────────────────────────
unbind = SUPER, TAB
unbind = SUPER SHIFT TAB
bindd = SUPER, TAB, Cycle: Next, cyclenext
bindd = SUPER SHIFT, TAB, Cycle: Previous, cyclenext, prev
bindd = SUPER, TAB, Bring to top, bringactivetotop
bindd = SUPER SHIFT, TAB, Bring to top, bringactivetotop


# ─────────────────────────
# Focus & swap
# ─────────────────────────
unbind = SUPER, H
bindd = SUPER, H, Focus: Left, movefocus, l

unbind = SUPER, L
bindd = SUPER, L, Focus: Right, movefocus, r

unbind = SUPER, K
bindd = SUPER, K, Focus: Up, movefocus, u

unbind = SUPER, J
bindd = SUPER, J, Focus: Down, movefocus, d

unbind = SUPER ALT, H
bindd = SUPER ALT, H, Swap: Left,  swapwindow, l

unbind = SUPER ALT, L
bindd = SUPER ALT, L, Swap: Right, swapwindow, r

unbind = SUPER ALT, K
bindd = SUPER ALT, K, Swap: Up, swapwindow, u

unbind = SUPER ALT, J
bindd = SUPER ALT, J, Swap: Down, swapwindow, d


# ─────────────────────────
# Layout toggles
# ─────────────────────────
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Toggle maximize, fullscreen, 1

unbind = SUPER ALT, SPACE
bindd = SUPER SHIFT, SPACE, Toggle fullscreen, fullscreen, 0

unbind = SUPER ALT, I
bindd = SUPER ALT, I, Toggle split, layoutmsg, togglesplit
