
# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

# Dynamic custom bindings

bindd = SUPER, F1, Add work_01 bindings, exec, bash -lc 'B="$HOME/.config/hypr/binds"; C="$HOME/.config/hypr/binds/custom.conf"; T="$(mktemp "$B/.tmp.XXXX")"; cp --reflink=auto "$B/work_01.conf" "$T"; mv -f "$T" "$C"; hyprctl reload; notify-send Hyprland "Profile → work_01"'
bindd = SUPER, F2, Add work_02 bindings, exec, bash -lc 'B="$HOME/.config/hypr/binds"; C="$HOME/.config/hypr/binds/custom.conf"; T="$(mktemp "$B/.tmp.XXXX")"; cp --reflink=auto "$B/work_02.conf" "$T"; mv -f "$T" "$C"; hyprctl reload; notify-send Hyprland "Profile → work_02"'
bindd = SUPER, F3, Set monitors default, exec, bash -lc 'B="$HOME/.config/hypr/monitors"; C="$HOME/.config/hypr/monitors.conf"; T="$(mktemp "$B/.tmp.XXXX")"; cp --reflink=auto "$B/default.conf" "$T"; mv -f "$T" "$C"; hyprctl reload; notify-send Hyprland "Monitors -> Default"'

unbind = SUPER ALT, SPACE

unbind = SUPER, S
bindd = SUPER, S, Launch apps, exec, walker -p "Start…"
bindd = SUPER SHIFT, S, Omarchy menu, exec, omarchy-menu
bindd = SUPER ALT, S, Show key bindings, exec, omarchy-menu-keybindings

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"

unbind = SUPER, F
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window

bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, B, Firefox, exec, firefox --new-window 

bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password

bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com"
bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://mail.google.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Workspace bindings

unbind = SUPER, I
unbind = SUPER, O
unbind = SUPER SHIFT, O
unbind = SUPER SHIFT, K

bindd = SUPER, O, Go to next workspace, workspace, +1
bindd = SUPER, I, Go to previous workspace, workspace, -1
bindd = SUPER SHIFT, O, Move vindow to next workspace, movetoworkspace, +1
bindd = SUPER SHIFT, I, Move vindow to previous workspace, movetoworkspace, -1

# Cycle through applications on active workspace

unbind = SUPER, TAB
unbind = SUPER SHIFT TAB
bindd = SUPER, TAB, Cycle to next window, cyclenext
bindd = SUPER SHIFT, TAB, Cycle to prev window, cyclenext, prev
bindd = SUPER, TAB, Reveal active window on top, bringactivetotop
bindd = SUPER SHIFT, TAB, Reveal active window on top, bringactivetotop

# Window bindings

unbind = SUPER, H
bindd = SUPER, H, Move focus to the window on the left, movefocus, l

unbind = SUPER, L
bindd = SUPER, L, Move focus to the window on the right, movefocus, r

unbind = SUPER, K
bindd = SUPER, K, Move focus to the window above, movefocus, u

unbind = SUPER, J
bindd = SUPER, J, Move focus to the window below, movefocus, d

unbind = SUPER ALT, H
bindd = SUPER ALT, H, Swap with the window on the left,  swapwindow, l

unbind = SUPER ALT, L
bindd = SUPER ALT, L, Swap with the window on the right, swapwindow, r

unbind = SUPER ALT, K
bindd = SUPER ALT, K, Swap with the window above, swapwindow, u

unbind = SUPER ALT, J
bindd = SUPER ALT, J, Swap with the window below, swapwindow, d

unbind = SUPER, SPACE
bindd = SUPER, SPACE, Toggle maximize for the focused window, fullscreen, 1

unbind = SUPER ALT, SPACE
bindd = SUPER SHIFT, SPACE, Toggle fullscreen for the focused window, fullscreen, 0

unbind = SUPER ALT, I
bindd = SUPER ALT, I, Toggle window split, layoutmsg, togglesplit 

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
